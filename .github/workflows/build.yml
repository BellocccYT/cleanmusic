name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows portable + setup
            os: windows-latest
            args: "--win portable nsis"
            artifact: cleanmusic-windows
            files: "release/*.exe"
          - name: Linux AppImage
            os: ubuntu-latest
            args: "--linux AppImage"
            artifact: cleanmusic-linux
            files: "release/*.AppImage"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # AppImage cannot be cross-compiled from Windows, hence the matrix.
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.found }}
    steps:
      # Release-Text kommt aus docs/releases/<tag>.md (vor dem Tag anlegen).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases

      - name: Release-Notes suchen
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "name=CleanMusic ${TAG#v}" >> "$GITHUB_OUTPUT"
          if [ -f "docs/releases/$TAG.md" ]; then
            echo "path=docs/releases/$TAG.md" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Keine Release-Notes unter docs/releases/$TAG.md – Release ohne Text, kein Discord-Post."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: artifacts/*
          fail_on_unmatched_files: true

  # Erst wenn die Dateien oben sind – sonst landet ein Link ohne Downloads in Discord.
  discord:
    name: Discord-Changelog
    needs: release
    if: needs.release.outputs.notes == 'true'
    uses: ./.github/workflows/discord-changelog.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
