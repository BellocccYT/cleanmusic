name: pages

# Small website for share links (site/): https://bellocccyt.github.io/cleanmusic/
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "site/**"
      - "marketing/screenshots/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Copy icon, logo and screenshots
        run: |
          cp build/icon.png site/icon.png
          cp renderer/assets/logo.svg site/logo.svg
          mkdir -p site/screenshots
          cp marketing/screenshots/*.png site/screenshots/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # GitHub meldet das frisch hochgeladene Artefakt manchmal erst kurz
      # später; deploy-pages findet sonst 0 Artefakte (oder bei einem Re-Run
      # mehrere). Kurz warten macht den Deploy zuverlässig.
      - name: Kurz warten, bis das Pages-Artefakt sichtbar ist
        run: sleep 10

      - id: deployment
        uses: actions/deploy-pages@v5
