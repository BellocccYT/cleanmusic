<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Playlist in CleanMusic öffnen</title>
<meta name="description" content="Jemand hat dir eine Playlist geschickt – öffne sie in CleanMusic." />
<meta property="og:title" content="Playlist in CleanMusic öffnen" />
<meta property="og:description" content="Eine geteilte Playlist – ein Klick, und sie ist in deinem CleanMusic." />
<meta property="og:image" content="https://bellocccyt.github.io/cleanmusic/icon.png" />
<meta name="robots" content="noindex" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" />
<link rel="icon" href="../icon.png" />
<style>
  :root {
    --bg: #080a0e;
    --panel: #11161f;
    --border: #232c3a;
    --text: #e8ecf3;
    --muted: #8d99ac;
    --accent: #5b8cff;
    --accent2: #35e0c0;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme='dark']) {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --border: #dfe4ee;
      --text: #182030;
      --muted: #5d6a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: radial-gradient(120% 90% at 0% 0%, rgba(91, 140, 255, 0.18), transparent 60%),
      radial-gradient(110% 90% at 100% 100%, rgba(53, 224, 192, 0.14), transparent 60%), var(--bg);
    color: var(--text);
    font: 15px/1.5 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  main {
    width: 100%;
    max-width: 460px;
    padding: 28px 24px;
    border-radius: 22px;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    text-align: center;
  }
  .logo { width: 56px; height: 56px; border-radius: 14px; }
  .eyebrow { margin: 14px 0 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent2); }
  h1 { margin: 0; font-size: 24px; line-height: 1.25; overflow-wrap: anywhere; }
  .count { margin: 4px 0 0; color: var(--muted); }
  .open {
    display: block;
    margin: 20px 0 10px;
    padding: 13px 16px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #06121a;
    font-weight: 800;
    text-decoration: none;
  }
  .open:hover { filter: brightness(1.08); }
  .hint { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  ol { margin: 0; padding: 0 0 0 1.6em; max-height: 260px; overflow-y: auto; text-align: left; border-top: 1px solid var(--border); }
  li { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 14px; overflow-wrap: anywhere; }
  li span { color: var(--muted); }
  .download { margin-top: 18px; font-size: 13px; color: var(--muted); }
  .download a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img class="logo" src="../icon.png" alt="CleanMusic" />
  <div class="eyebrow">Geteilte Playlist</div>
  <h1 id="title">Playlist</h1>
  <p class="count" id="count"></p>
  <a class="open" id="open" href="#">In CleanMusic öffnen</a>
  <p class="hint" id="hint">CleanMusic fragt vorher, ob die Playlist übernommen werden soll.</p>
  <ol id="list"></ol>
  <p class="download">Noch kein CleanMusic? <a href="https://bellocccyt.github.io/cleanmusic/">Kostenlos herunterladen</a></p>
</main>
<script>
(async () => {
  // The code travels in the #fragment – it is never sent to a server.
  const code = decodeURIComponent((location.hash || '').slice(1)).trim();
  const open = document.getElementById('open');
  const hint = document.getElementById('hint');
  const fail = (text) => {
    open.hidden = true;
    hint.textContent = text;
  };
  if (!/^P1\.[A-Za-z0-9_-]{8,12000}$/.test(code)) return fail('Dieser Link ist unvollständig. Bitte den ganzen Link schicken lassen.');
  open.href = 'cleanmusic://playlist?d=' + encodeURIComponent(code);
  // Preview of the content (only for display – CleanMusic checks everything again).
  try {
    const body = code.slice(3);
    const padded = body.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((body.length + 3) % 4);
    const bytes = Uint8Array.from(atob(padded), (c) => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const data = JSON.parse(await new Response(stream).text());
    const tracks = Array.isArray(data.t) ? data.t.slice(0, 100) : [];
    document.getElementById('title').textContent = String(data.n || 'Playlist').slice(0, 80);
    document.title = String(data.n || 'Playlist').slice(0, 80) + ' · CleanMusic';
    document.getElementById('count').textContent = tracks.length + ' Titel';
    const list = document.getElementById('list');
    tracks.forEach((row) => {
      const item = document.createElement('li');
      item.textContent = String(row[2] || '').slice(0, 80);
      if (row[3]) {
        const artist = document.createElement('span');
        artist.textContent = ' – ' + String(row[3]).slice(0, 80);
        item.appendChild(artist);
      }
      list.appendChild(item);
    });
  } catch {
    /* only the preview failed – the link still works */
  }
  setTimeout(() => { location.href = open.href; }, 700);
})();
</script>
</body>
</html>
