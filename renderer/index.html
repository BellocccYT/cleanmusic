<!doctype html>
<html lang="de" data-perf="balanced">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data: https: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' file: https: http:; connect-src 'self'; object-src 'none';"
  />
  <title>CleanMusic</title>
  <link rel="icon" href="assets/logo-small.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app-bg" aria-hidden="true"><canvas id="live-bg-canvas"></canvas><video id="live-bg-video" muted loop playsinline disablepictureinpicture></video><img id="live-bg-gif" alt="" /></div>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <img class="logo" src="assets/logo-small.svg" alt="" draggable="false" />
        <div class="brand-text">
          <span class="brand-name">CleanMusic</span>
          <span class="brand-sub">The Music Launcher</span>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input
          id="global-search"
          type="search"
          placeholder="Song, Artist oder Album suchen …"
          autocomplete="off"
          spellcheck="false"
        />
        <kbd>↵</kbd>
      </div>

      <div class="topbar-actions">
        <button id="btn-open-external" class="btn ghost small" disabled>Im Browser</button>
      </div>
    </header>

    <nav id="sidebar">
      <div class="nav-group">
        <div class="nav-label">Start</div>
        <button class="nav-item active" data-view="home">
          <span class="nav-dot"></span>Home
        </button>
        <button class="nav-item" data-view="search">
          <span class="nav-dot"></span>Suche
        </button>
        <button class="nav-item" data-view="mixes">
          <span class="nav-ic">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6L12 3Z"></path><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"></path></svg>
          </span>
          <span class="svc-name">Mixes</span>
        </button>
        <button class="nav-item" data-view="radio">
          <span class="nav-dot"></span>Radio
        </button>
        <button class="nav-item" data-view="creator">
          <span class="nav-ic">
            <svg class="ic" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M20 4 8.1 15.9"></path><path d="M14.5 14.5 20 20"></path><path d="M8.1 8.1 12 12"></path></svg>
          </span>
          <span class="svc-name">Cutter-Modus</span>
        </button>
      </div>

      <div class="nav-group">
        <div class="nav-label">Bibliothek</div>
        <button class="nav-item" data-view="favorites" data-drop="favorites">
          <span class="nav-ic heart">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 20.2s-7.2-4.4-9.2-8.9C1.5 8.1 3.4 4.6 6.9 4.6c2.2 0 3.9 1.3 5.1 3 1.2-1.7 2.9-3 5.1-3 3.5 0 5.4 3.5 4.1 6.7-2 4.5-9.2 8.9-9.2 8.9Z"></path></svg>
          </span>
          <span class="svc-name">Favoriten</span>
          <span class="nav-count" id="fav-count"></span>
        </button>
        <button class="nav-item" data-view="local">
          <span class="nav-ic">
            <svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"></path></svg>
          </span>
          <span class="svc-name">Lokale Musik</span>
        </button>
        <button class="nav-item" data-view="presets">
          <span class="nav-ic">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6L12 3Z"></path></svg>
          </span>
          <span class="svc-name">Vorlagen</span>
        </button>
        <div id="playlist-nav" class="playlist-nav"></div>
        <button class="nav-item nav-new" id="btn-new-playlist" data-drop="new" title="Neue Playlist (auch per Drag & Drop)">
          <span class="nav-ic">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
          </span>
          <span class="svc-name">Neue Playlist</span>
        </button>
        <button class="nav-item nav-new" id="btn-smart-playlist" title="Smart-Playlist aus Regeln erstellen">
          <span class="nav-ic">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6L12 3Z"></path></svg>
          </span>
          <span class="svc-name">Smart-Playlist</span>
        </button>
        <button class="nav-item nav-new" id="btn-spotify-import" title="Playlist übertragen">
          <span class="nav-ic"><span aria-hidden="true">↗</span></span>
          <span class="svc-name">Playlist übertragen</span>
        </button>
        <button class="nav-item" data-view="downloads">
          <span class="nav-ic">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11"></path><path d="m7 10 5 5 5-5"></path><path d="M5 20h14"></path></svg>
          </span>
          <span class="svc-name">Downloads</span>
        </button>
        <button class="nav-item" data-view="review">
          <span class="nav-ic">
            <svg class="ic" viewBox="0 0 24 24"><path d="M5 20V11"></path><path d="M12 20V5"></path><path d="M19 20v-7"></path></svg>
          </span>
          <span class="svc-name">Dein Rückblick</span>
        </button>
      </div>

      <div class="nav-group grow">
        <div class="nav-label">Dienste <span class="nav-label-hint" id="service-count"></span></div>
        <div id="service-nav"></div>
        <button class="nav-label nav-label-btn creator-label" data-nav-toggle="creator" aria-expanded="false">Creator <span class="nav-chevron">›</span></button>
        <div id="creator-nav" class="nav-collapse" hidden></div>
      </div>

      <div class="sidebar-footer">
        <button class="nav-item" data-view="settings">
          <span class="nav-dot"></span>Einstellungen
        </button>
        <p class="legal">Offizielle Web-Player, kein DRM-Bypass.<br />Plugins optional und nicht enthalten.</p>
      </div>
    </nav>

    <main id="content">
      <section id="view-home" class="view active"></section>
      <section id="view-mixes" class="view"></section>
      <section id="view-search" class="view"></section>
      <section id="view-local" class="view"></section>
      <section id="view-artist" class="view"></section>
      <section id="view-review" class="view"></section>
      <section id="view-downloads" class="view"></section>
      <section id="view-presets" class="view"></section>
      <section id="view-radio" class="view"></section>
      <section id="view-creator" class="view"></section>
      <section id="view-favorites" class="view"></section>
      <section id="view-playlist" class="view"></section>
      <section id="view-settings" class="view"></section>

      <div id="service-host"></div>

      <div id="service-banner" class="banner"></div>

      <div id="update-card" class="update-card" role="status" hidden></div>
      <div id="whatsnew-card" class="update-card whatsnew-card" role="status" hidden></div>

      <aside id="queue-panel" class="queue-panel" aria-label="Warteschlange" hidden></aside>

      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <span id="loading-text">Lädt …</span>
      </div>
    </main>

    <footer id="playerbar">
      <div class="np">
        <div class="np-art" id="np-art">
          <span id="np-art-letter">♪</span>
          <img id="np-art-img" alt="" hidden />
        </div>
        <div class="np-meta">
          <div class="np-title" id="np-title">Nichts ausgewählt</div>
          <div class="np-artist" id="np-artist">Lokale Wiedergabe</div>
          <span class="np-badge" id="np-badge" hidden></span>
          <span class="stream-badge" id="stream-badge" hidden></span>
        </div>
        <div class="np-actions">
          <button class="icon-btn" id="btn-np-why" title="Warum läuft das?" disabled>
            <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-.9.6-1.5 1.2-1.5 2.5"></path><path d="M12 17h.01"></path></svg>
          </button>
          <button class="icon-btn" id="btn-lyrics" title="Songtext (öffnet den Vollbild-Player)">
            <svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16"></path><path d="M4 12h10"></path><path d="M4 18h13"></path></svg>
          </button>
          <button class="icon-btn fav" id="btn-np-fav" title="Zu Favoriten" disabled>
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 20.2s-7.2-4.4-9.2-8.9C1.5 8.1 3.4 4.6 6.9 4.6c2.2 0 3.9 1.3 5.1 3 1.2-1.7 2.9-3 5.1-3 3.5 0 5.4 3.5 4.1 6.7-2 4.5-9.2 8.9-9.2 8.9Z"></path></svg>
          </button>
          <button class="icon-btn" id="btn-np-add" title="Zur Playlist hinzufügen" disabled>
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
          </button>
        </div>
      </div>

      <div class="controls">
        <div class="buttons">
          <button class="icon-btn" id="btn-shuffle" title="Shuffle" disabled>
            <svg class="stroke" viewBox="0 0 24 24"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
          </button>
          <button class="icon-btn" id="btn-prev" title="Zurück" disabled>
            <svg viewBox="0 0 24 24"><path d="M18 5 8 12l10 7V5Z"></path><rect x="5" y="5" width="2.2" height="14" rx="1"></rect></svg>
          </button>
          <button class="icon-btn play" id="btn-play" title="Wiedergabe" disabled>
            <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5Z"></path></svg>
            <svg class="ic-pause" viewBox="0 0 24 24"><rect x="7" y="5" width="3.6" height="14" rx="1"></rect><rect x="13.4" y="5" width="3.6" height="14" rx="1"></rect></svg>
          </button>
          <button class="icon-btn" id="btn-next" title="Weiter" disabled>
            <svg viewBox="0 0 24 24"><path d="M6 5l10 7-10 7V5Z"></path><rect x="16.8" y="5" width="2.2" height="14" rx="1"></rect></svg>
          </button>
          <button class="icon-btn" id="btn-repeat" title="Wiederholen" disabled>
            <svg class="stroke" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"></path><path d="M20 6H8a4 4 0 0 0-4 4"></path><path d="M7 21l-3-3 3-3"></path><path d="M4 18h12a4 4 0 0 0 4-4"></path></svg>
          </button>
        </div>

        <div class="seek-row">
          <span class="time" id="t-cur">0:00</span>
          <input id="seek" type="range" min="0" max="0" value="0" step="0.1" />
          <span class="time" id="t-dur">0:00</span>
        </div>

        <div id="live-indicator" class="live-indicator" hidden>
          <span class="live-dot"></span>LIVE
        </div>
      </div>

      <div class="right-controls">
        <canvas id="mini-viz" class="mini-viz" aria-hidden="true"></canvas>
        <button class="icon-btn" id="btn-queue" title="Warteschlange">
          <svg class="ic" viewBox="0 0 24 24"><path d="M4 6h12"></path><path d="M4 11h12"></path><path d="M4 16h7"></path><path d="M15 14.5v6l5-3z"></path></svg>
        </button>
        <button class="icon-btn" id="btn-mini" title="Mini-Player öffnen" aria-label="Mini-Player öffnen">▣</button>
        <button class="icon-btn" id="btn-sleep" title="Schlaf-Timer">
          <svg class="ic" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"></path></svg>
        </button>
        <button class="icon-btn" id="btn-fullscreen" title="Vollbild-Player (F)">
          <svg class="ic" viewBox="0 0 24 24"><path d="M15 3h6v6"></path><path d="M9 21H3v-6"></path><path d="M21 3l-7 7"></path><path d="M3 21l7-7"></path></svg>
        </button>
        <button class="icon-btn vol-btn" id="btn-mute" title="Stumm schalten (M)" data-level="high">
          <svg class="stroke ic-vol" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4H4Z"></path><path class="w1" d="M15.5 9.2a4 4 0 0 1 0 5.6"></path><path class="w2" d="M18.3 6.6a7.6 7.6 0 0 1 0 10.8"></path><path class="x" d="M16 9.6l4.8 4.8M20.8 9.6 16 14.4"></path></svg>
        </button>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="1" title="Lautstärke – Mausrad, M = stumm, +/−" />
        <span class="volume-pct" id="volume-pct">92 %</span>
      </div>

      <audio id="audio"></audio>
    </footer>
  </div>

  <div id="fullscreen" class="fs" hidden>
    <div class="fs-bg" aria-hidden="true">
      <canvas id="fs-live-bg-canvas"></canvas>
      <img id="fs-bg-img" alt="" hidden />
      <div class="fs-glow"></div>
    </div>
    <canvas id="fs-viz" class="fs-viz" aria-hidden="true"></canvas>

    <header class="fs-top">
      <div class="fs-brand"><img class="logo" src="assets/logo-small.svg" alt="" draggable="false" /> CleanMusic</div>
      <div class="fs-top-actions">
        <select id="fs-background-mode" class="fs-bg-select" aria-label="Vollbild-Hintergrund">
          <option value="cover-static">Cover ruhig</option>
          <option value="cover-moving">Cover bewegt</option>
          <option value="live">Live-Hintergrund</option>
          <option value="off">Hintergrund aus</option>
        </select>
        <div class="fs-styles" id="fs-styles">
          <button data-fs-style="radial">Kreis</button>
          <button data-fs-style="bars">Balken</button>
          <button data-fs-style="wave">Welle</button>
          <button data-fs-style="mirror">Spiegel</button>
          <button data-fs-style="particles">Partikel</button>
          <button data-fs-style="off">Aus</button>
        </div>
        <button class="fs-icon" id="fs-vinyl" data-fs-act="vinyl" title="Plattenspieler an/aus">
          <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle><path d="M12 5.5a6.5 6.5 0 0 1 6.5 6.5"></path></svg>
        </button>
        <button class="fs-icon" data-fs-act="close" title="Schließen (Esc)">
          <svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
        </button>
      </div>
    </header>

    <main class="fs-main">
      <div class="fs-cover-wrap">
        <div class="fs-tonearm" aria-hidden="true"><i class="pivot"></i><i class="arm"></i></div>
        <div class="fs-cover" id="fs-cover">
          <img id="fs-cover-img" alt="" hidden />
          <span id="fs-cover-letter">♪</span>
        </div>
      </div>

      <section class="fs-meta">
        <span class="fs-badge" id="fs-badge" hidden></span>
        <h1 class="fs-title" id="fs-title">Nichts ausgewählt</h1>
        <div class="fs-artist" id="fs-artist"></div>
        <div class="fs-lyrics-tools" id="fs-lyrics-tools" hidden></div>
        <div class="fs-lyrics" id="fs-lyrics" hidden></div>

        <div class="fs-progress" id="fs-progress">
          <span id="fs-cur">0:00</span>
          <input id="fs-seek" type="range" min="0" max="0" value="0" step="0.1" />
          <span id="fs-dur">0:00</span>
        </div>
        <div class="fs-live" id="fs-live" hidden><span class="live-dot"></span>LIVE</div>

        <div class="fs-controls">
          <button class="fs-ctrl" id="fs-shuffle" data-fs-act="shuffle" title="Shuffle">
            <svg class="ic" viewBox="0 0 24 24"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
          </button>
          <button class="fs-ctrl" data-fs-act="prev" title="Zurück (P)">
            <svg class="ic fill" viewBox="0 0 24 24"><path d="M18 5 8 12l10 7V5Z"></path><rect x="5" y="5" width="2.2" height="14" rx="1"></rect></svg>
          </button>
          <button class="fs-play" id="fs-play" data-fs-act="play" title="Wiedergabe (Leertaste)">
            <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5Z"></path></svg>
            <svg class="ic-pause" viewBox="0 0 24 24"><rect x="7" y="5" width="3.6" height="14" rx="1"></rect><rect x="13.4" y="5" width="3.6" height="14" rx="1"></rect></svg>
          </button>
          <button class="fs-ctrl" data-fs-act="next" title="Weiter (N)">
            <svg class="ic fill" viewBox="0 0 24 24"><path d="M6 5l10 7-10 7V5Z"></path><rect x="16.8" y="5" width="2.2" height="14" rx="1"></rect></svg>
          </button>
          <button class="fs-ctrl" id="fs-repeat" data-fs-act="repeat" title="Wiederholen">
            <svg class="ic" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3"></path><path d="M20 6H8a4 4 0 0 0-4 4"></path><path d="M7 21l-3-3 3-3"></path><path d="M4 18h12a4 4 0 0 0 4-4"></path></svg>
          </button>
        </div>

        <div class="fs-actions">
          <button class="fs-ctrl fav" id="fs-fav" data-fs-act="fav" title="Zu Favoriten">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 20.2s-7.2-4.4-9.2-8.9C1.5 8.1 3.4 4.6 6.9 4.6c2.2 0 3.9 1.3 5.1 3 1.2-1.7 2.9-3 5.1-3 3.5 0 5.4 3.5 4.1 6.7-2 4.5-9.2 8.9-9.2 8.9Z"></path></svg>
          </button>
          <button class="fs-ctrl" id="fs-add" data-fs-act="add" title="Zur Playlist hinzufügen">
            <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
          </button>
          <button class="fs-ctrl" id="fs-lyrics-btn" data-fs-act="lyrics" title="Songtext ein/aus">
            <svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16"></path><path d="M4 12h10"></path><path d="M4 18h13"></path></svg>
          </button>
          <div class="fs-volume">
            <button class="fs-mute vol-btn" id="fs-mute" title="Stumm schalten (M)" data-level="high">
              <svg class="ic ic-vol" viewBox="0 0 24 24"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4H4Z"></path><path class="w1" d="M15.5 9.2a4 4 0 0 1 0 5.6"></path><path class="w2" d="M18.3 6.6a7.6 7.6 0 0 1 0 10.8"></path><path class="x" d="M16 9.6l4.8 4.8M20.8 9.6 16 14.4"></path></svg>
            </button>
            <input id="fs-volume" type="range" min="0" max="1" step="0.01" value="1" title="Lautstärke – Mausrad, ↑/↓, M = stumm" />
            <span class="fs-volume-pct" id="fs-volume-pct"></span>
          </div>
        </div>
      </section>
    </main>

    <aside class="fs-next" id="fs-next" hidden></aside>
    <div class="fs-hint">F · Leertaste · ← → · ↑ ↓ · N/P · Esc</div>
  </div>

  <div id="service-menu" class="service-menu" hidden></div>
  <div id="ctx-menu" class="service-menu" hidden></div>

  <div id="onboarding" class="onboarding" hidden></div>

  <div id="dialog" class="dialog-backdrop" hidden>
    <form class="dialog" id="dialog-form" autocomplete="off">
      <h3 id="dialog-title"></h3>
      <div id="dialog-text" class="muted small" hidden></div>
      <input id="dialog-input" type="text" maxlength="80" spellcheck="false" />
      <div class="dialog-actions">
        <button type="button" class="btn ghost small" id="dialog-cancel">Abbrechen</button>
        <button type="submit" class="btn primary small" id="dialog-ok">OK</button>
      </div>
    </form>
  </div>

  <div id="toast" class="toast"></div>

  <script src="services.js"></script>
  <script src="themes.js"></script>
  <script src="creator-data.js"></script>
  <script src="playlist-presets.js"></script>
  <script src="visualizer.js"></script>
  <script src="live-bg.js"></script>
  <script src="core/storage.js"></script>
  <script src="core/persist.js"></script>
  <script src="core/migrations.js"></script>
  <script src="core/text.js"></script>
  <script src="audio/queue.js"></script>
  <script src="onboarding-music.js"></script>
  <script src="app.js"></script>
</body>
</html>
